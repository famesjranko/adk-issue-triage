<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="t d">
  <title id="t">The triage pipeline</title>
  <desc id="d">START feeds intake_agent, which writes state issue. That fans out to kind_agent, area_agent and dupe_agent running concurrently. All three must reach a JoinNode before priority_agent runs, then readiness_agent. A write to GitHub through apply_labels is gated and suspends the run.</desc>
  <rect width="1200" height="400" rx="18" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,1 9,4.5 0,8" fill="#c8d0da"/>
    </marker>
    <marker id="ac" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,1 9,4.5 0,8" fill="#1f6382"/>
    </marker>
    <marker id="ah" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,1 9,4.5 0,8" fill="#9c3a26"/>
    </marker>
  </defs>

  <text x="40" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.2px" fill="#6a7484">SIX MODEL CALLS AND ONE PIECE OF CONTROL FLOW</text>

  <line x1="114" y1="242.0" x2="144" y2="242.0" stroke="#c8d0da" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M300 242.0 H322 V152 H340" stroke="#c8d0da" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <line x1="300" y1="242.0" x2="340" y2="242.0" stroke="#c8d0da" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M300 242.0 H322 V332 H340" stroke="#c8d0da" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

  <path d="M496 152 H520 V242.0 H536" stroke="#1f6382" stroke-width="1.4" fill="none" marker-end="url(#ac)"/>
  <line x1="496" y1="242.0" x2="536" y2="242.0" stroke="#1f6382" stroke-width="1.4" marker-end="url(#ac)"/>
  <path d="M496 332 H520 V242.0 H536" stroke="#1f6382" stroke-width="1.4" fill="none" marker-end="url(#ac)"/>

  <line x1="638" y1="242.0" x2="678" y2="242.0" stroke="#c8d0da" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="834" y1="242.0" x2="866" y2="242.0" stroke="#c8d0da" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="1022" y1="242.0" x2="1040" y2="242.0" stroke="#9c3a26" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <rect x="40" y="216" width="74" height="52" rx="7" fill="none" stroke="#c8d0da" stroke-dasharray="4 3"/>
  <text x="77" y="248" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#c8d0da">START</text>
  <rect x="150" y="216" width="150" height="52" rx="7" fill="#f6eddc" stroke="#a1650d"/>
  <text x="225" y="246" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#151a21">intake_agent</text>
  <text x="225" y="261" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6a7484">state["issue"]</text>
  <rect x="346" y="126" width="150" height="52" rx="7" fill="#f6eddc" stroke="#a1650d"/>
  <text x="421" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#151a21">kind_agent</text>
  <text x="421" y="171" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6a7484">state["kind"]</text>
  <rect x="346" y="216" width="150" height="52" rx="7" fill="#f6eddc" stroke="#a1650d"/>
  <text x="421" y="246" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#151a21">area_agent</text>
  <text x="421" y="261" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6a7484">state["area"]</text>
  <rect x="346" y="306" width="150" height="52" rx="7" fill="#f6eddc" stroke="#a1650d"/>
  <text x="421" y="336" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#151a21">dupe_agent</text>
  <text x="421" y="351" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6a7484">state["duplicates"]</text>
  <rect x="542" y="216" width="96" height="52" rx="7" fill="#e4eef4" stroke="#1f6382"/>
  <text x="590" y="246" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1f6382">JoinNode</text>
  <text x="590" y="261" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6a7484">waits for all</text>
  <rect x="684" y="216" width="150" height="52" rx="7" fill="#f6eddc" stroke="#a1650d"/>
  <text x="759" y="246" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#151a21">priority_agent</text>
  <text x="759" y="261" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6a7484">state["priority"]</text>
  <rect x="872" y="216" width="150" height="52" rx="7" fill="#f6eddc" stroke="#a1650d"/>
  <text x="947" y="246" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#151a21">readiness_agent</text>
  <text x="947" y="261" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6a7484">state["readiness"]</text>
  <rect x="1046" y="216" width="112" height="52" rx="7" fill="#f7e6e1" stroke="#9c3a26"/>
  <text x="1102" y="246" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#9c3a26">apply_labels</text>
  <text x="1102" y="261" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6a7484">gated</text>
  <text x="421" y="108" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6a7484">concurrent &#8212; none reads another&#8217;s output</text>
  <text x="590" y="300" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1f6382">AND-join</text>
  <text x="1102" y="300" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9c3a26">suspends the run</text>
  <text x="40" y="374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#6a7484">Each agent writes exactly one key into session state; the next step reads it by name. The order is fixed and known before any request arrives, so it is graph shape &#8212; not a prompt.</text>
</svg>
