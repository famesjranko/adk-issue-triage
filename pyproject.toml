[project]
name = "issue-triage"
version = "0.1.0"
description = "Google ADK issue-triage agent — graph Workflow vs deprecated SequentialAgent, suspend-based approval gates, and per-field evals against real human labels"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.8",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
